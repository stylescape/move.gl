
---


# =============================================================================
# Options
# =============================================================================

options:

    mode: development
    live:
        enabled: false
        port: 3002
        root: public
        watchPaths:
            - src/**
            - config/**
        ignoredPaths:
            - node_modules/**
    logLevel: debug


# =============================================================================
# Stages
# =============================================================================

stages:

    # Preprocessing
    # =========================================================================
    -
        name: Preprocessing
        description: "Before starting a new build."

        steps:

            # Dirs Clean (tolerant - ignores missing files/dirs)
            # -----------------------------------------------------------------
            -
                name: CleanBuildDirStep
                action: DirectoryCleanAction
                options:
                    dirPath: "./dist"
                    tolerant: true

            # Process SCSS to CSS
            # -----------------------------------------------------------------
            -   name: ProcessMainStyles
                action: StyleProcessingAction
                options:
                    inputFile: "./src/scss/index.scss"
                    outputFile: "./dist/css/move.gl.min.css"
                    styleOption: "compressed"
            -
                name: ProcessAdditionalStyles
                action: StyleProcessingAction
                options:
                    inputFile: "./src/scss/index.scss"
                    outputFile: "./dist/css/move.gl.css"
                    styleOption: "expanded"

            # Process Docs SCSS to CSS (separate from package CSS)
            # -----------------------------------------------------------------
            -   name: ProcessDocsStyles
                action: StyleProcessingAction
                options:
                    inputFile: "./src/scss/docs.scss"
                    outputFile: "./dist/css/move.gl.docs.min.css"
                    styleOption: "compressed"
            -
                name: ProcessAdditionalDocsStyles
                action: StyleProcessingAction
                options:
                    inputFile: "./src/scss/docs.scss"
                    outputFile: "./dist/css/move.gl.docs.css"
                    styleOption: "expanded"

            # Copy Files
            # -----------------------------------------------------------------
            -
                name: CopyLICENSE
                action: FileCopyAction
                options:
                    srcFile: "./LICENSE"
                    destDir: "./dist"
            -
                name: CopyREADME
                action: FileCopyAction
                options:
                    srcFile: "./README.md"
                    destDir: "./dist"

            # Copy Dirs
            # -----------------------------------------------------------------
            -
                name: CopySrcSCSS
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/scss"
                    destDir: "./dist/scss"
            -
                name: CopySrcTS
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/ts"
                    destDir: "./dist/ts"

            # RenderTemplates
            # -----------------------------------------------------------------

            -
                name: RenderTemplates
                action: TemplateRenderAction
                options:
                    templatesDir: "./src/jinja"
                    outputDir: "./src/html"
                    renderAllFromDir: true
                context:
                    name: "move.gl"
                    version: "0.0.1"
                    author: "Lars van Vianen"


            # Copy Dirs
            # -----------------------------------------------------------------
            -
                name: CopySrcSCSSAgain
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/scss"
                    destDir: "./dist/scss"
            -
                name: CopySrcHTML
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/html"
                    destDir: "./dist/html"

            # Compile TS to JS
            # -----------------------------------------------------------------

            -
                name: Compile TS to JS
                action: TypeScriptCompilerAction
                options:
                    tsConfigPath: "./tsconfig.json"
                    filePaths:
                        - "src/ts/index.ts"
                        - "src/ts/demo.ts"
