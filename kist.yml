
---


# =============================================================================
# Options
# =============================================================================

options:

    mode: production
    logLevel: info


# =============================================================================
# Stages
# =============================================================================

stages:

    # Build
    # =========================================================================
    -
        name: Build
        description: "Production build."

        steps:

            # Dirs Clean (tolerant - ignores missing files/dirs)
            # -----------------------------------------------------------------
            -
                name: CleanBuildDirStep
                action: DirectoryCleanAction
                options:
                    dirPath: "./dist"
                    tolerant: true

            # Process SCSS to CSS
            # -----------------------------------------------------------------
            -   name: ProcessMainStyles
                action: StyleProcessingAction
                options:
                    inputFile: "./src/scss/index.scss"
                    outputFile: "./dist/css/move.gl.min.css"
                    styleOption: "compressed"
            -
                name: ProcessAdditionalStyles
                action: StyleProcessingAction
                options:
                    inputFile: "./src/scss/index.scss"
                    outputFile: "./dist/css/move.gl.css"
                    styleOption: "expanded"

            # Copy Files
            # -----------------------------------------------------------------
            -
                name: CopyLICENSE
                action: FileCopyAction
                options:
                    srcFile: "./LICENSE"
                    destDir: "./dist"
            -
                name: CopyREADME
                action: FileCopyAction
                options:
                    srcFile: "./README.md"
                    destDir: "./dist"

            # Copy Dirs
            # -----------------------------------------------------------------
            -
                name: CopySrcSCSS
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/scss"
                    destDir: "./dist/scss"
            -
                name: CopySrcTS
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/ts"
                    destDir: "./dist/ts"

            # Generate package.json for distribution
            # -----------------------------------------------------------------
            -
                name: GeneratePackageJSON
                action: PackageManagerAction
                options:
                    packageJsonPath: "./package.json"
                    outputDir: "./dist"
                    fields:
                        - name
                        - version
                        - description
                        - keywords
                        - license
                        - homepage
                        - author
                        - contributors
                        - repository
                        - funding
                        - sass
                        - style
                        - exports

            # Version synchronization
            # -----------------------------------------------------------------
            -
                name: SyncVersion
                action: VersionWriteAction
                options:
                    files:
                        - path: "./CITATION.cff"
                          key: "version: "
                        - path: "./VERSION"
                          key: "v"
